# Production stack. Postgres is published on the host's loopback only, and the app uses
# host networking, so DATABASE_URL points at 127.0.0.1:5432 both at runtime and during
# `next build` (which prerenders pages from the DB). The cloudflared service exposes
# 127.0.0.1:${APP_PORT} to the internet through a Cloudflare Tunnel. See deploy/DEPLOY.md.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Built by deploy/build.sh (compose can't grant the build host networking)
    image: rate-freak-cms:latest
    restart: unless-stopped
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      # Only listen on loopback; the Cloudflare Tunnel is the public entrypoint.
      HOSTNAME: 127.0.0.1
      # Override with APP_PORT in `.env` if 3000 is taken on the host.
      PORT: ${APP_PORT:-3000}

  # Cloudflare Tunnel: publishes the app without opening router ports.
  # Point the tunnel's public hostname at http://localhost:<APP_PORT> (default 3000) in the Cloudflare dashboard.
  # TUNNEL_TOKEN lives in `.env` next to this file (kept separate so cloudflared doesn't get the app's secrets).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - app

  # One-off: docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    image: rate-freak-cms-migrate:latest
    build:
      context: .
      target: migrate
    profiles:
      - tools
    network_mode: host
    env_file:
      - .env.production

volumes:
  pgdata:
